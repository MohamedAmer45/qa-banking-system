name: Cypress Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cypress/**", ".github/workflows/cypress.yml", ".github/actions/start-novabank/**"]
  pull_request:
    branches: [main]
    paths: ["cypress/**", ".github/workflows/cypress.yml", ".github/actions/start-novabank/**"]

permissions:
  contents: read

concurrency:
  group: cypress-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cypress:
    name: Cypress Chrome Regression
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novabank
          POSTGRES_PASSWORD: novabank
          POSTGRES_DB: novabank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novabank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      CYPRESS_BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Check out QA repository
        uses: actions/checkout@v4

      - name: Start NovaBank
        uses: ./.github/actions/start-novabank

      - name: Install suite dependencies
        working-directory: cypress
        run: npm ci

      - name: Run Cypress
        working-directory: cypress
        run: npm run validate

      - name: Application log
        if: always()
        run: cat "${RUNNER_TEMP}/novabank.log" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-results-${{ github.run_id }}
          path: |
            cypress/cypress/results/
            cypress/cypress/screenshots/
            cypress/cypress/videos/
          if-no-files-found: ignore
          retention-days: 14
