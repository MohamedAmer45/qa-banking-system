name: Database Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["database-testing/**", ".github/workflows/database.yml", ".github/actions/start-novabank/**"]
  pull_request:
    branches: [main]
    paths: ["database-testing/**", ".github/workflows/database.yml", ".github/actions/start-novabank/**"]

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database:
    name: SQL and cross-layer integrity
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novabank
          POSTGRES_PASSWORD: novabank
          POSTGRES_DB: novabank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novabank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The suite reads the same connection string the application uses, so the
      # two can never end up pointed at different databases.
      DATABASE_URL: postgresql://novabank:novabank@127.0.0.1:5432/novabank_test
      BASE_URL: http://127.0.0.1:3000

    steps:
      - name: Check out QA repository
        uses: actions/checkout@v4

      - name: Start NovaBank
        uses: ./.github/actions/start-novabank

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: database-testing/pom.xml

      - name: Run database suite
        working-directory: database-testing
        run: mvn --batch-mode --no-transfer-progress clean test

      - name: Generate Allure report
        if: always()
        working-directory: database-testing
        run: mvn --batch-mode --no-transfer-progress allure:report || true

      - name: Application log
        if: always()
        run: cat "${RUNNER_TEMP}/novabank.log" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-results-${{ github.run_id }}
          path: |
            database-testing/target/surefire-reports/
            database-testing/target/allure-results/
            database-testing/target/site/allure-maven-plugin/
          if-no-files-found: ignore
          retention-days: 14
