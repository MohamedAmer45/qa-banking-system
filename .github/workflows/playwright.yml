name: Playwright Tests

# Push and pull_request triggers are disabled until the suite is retargeted
# from the deleted stub to the real application. See _shared-notes.md.
on:
  workflow_dispatch:
  # push:
  #   branches: [main]
  #   paths: ["playwright/**", ".github/workflows/playwright.yml"]
  # pull_request:
  #   branches: [main]
  #   paths: ["playwright/**", ".github/workflows/playwright.yml"]

permissions:
  contents: read

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  playwright:
    name: Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novabank
          POSTGRES_PASSWORD: novabank
          POSTGRES_DB: novabank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novabank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BASE_URL: http://127.0.0.1:3000
      CI: "true"

    steps:
      - name: Check out QA repository
        uses: actions/checkout@v4

      - name: Start NovaBank
        uses: ./.github/actions/start-novabank

      - name: Install suite dependencies
        working-directory: playwright
        run: npm ci

      - name: Validate TypeScript
        working-directory: playwright
        run: npm run typecheck

      - name: Install browser
        working-directory: playwright
        run: npx playwright install --with-deps "${{ matrix.browser }}"

      - name: Run Playwright tests
        working-directory: playwright
        run: npm test -- --project="${{ matrix.browser }}"

      - name: Application log
        if: always()
        run: cat "${RUNNER_TEMP}/novabank.log" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.browser }}-${{ github.run_id }}
          path: |
            playwright/playwright-report/
            playwright/test-results/
          if-no-files-found: ignore
          retention-days: 14
