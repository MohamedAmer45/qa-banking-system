name: Cucumber BDD Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["cucumber/**", ".github/workflows/cucumber.yml", ".github/actions/start-novabank/**"]
  pull_request:
    branches: [main]
    paths: ["cucumber/**", ".github/workflows/cucumber.yml", ".github/actions/start-novabank/**"]

permissions:
  contents: read

concurrency:
  group: cucumber-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cucumber:
    name: Cucumber BDD Regression
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: novabank
          POSTGRES_PASSWORD: novabank
          POSTGRES_DB: novabank_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U novabank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      BASE_URL: http://127.0.0.1:3000
      SE_AVOID_STATS: "true"

    steps:
      - name: Check out QA repository
        uses: actions/checkout@v4

      - name: Start NovaBank
        uses: ./.github/actions/start-novabank

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: cucumber/pom.xml

      - name: Run suite
        working-directory: cucumber
        run: |
          mvn --batch-mode --no-transfer-progress clean test             -Dheadless=true             -Dbrowser=chrome             -Dbase.url="$BASE_URL"

      - name: Generate Allure report
        if: always()
        working-directory: cucumber
        run: mvn --batch-mode --no-transfer-progress allure:report || true

      - name: Application log
        if: always()
        run: cat "${RUNNER_TEMP}/novabank.log" || true

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-results-${{ github.run_id }}
          path: |
            cucumber/target/surefire-reports/
            cucumber/target/allure-results/
            cucumber/target/site/allure-maven-plugin/
          if-no-files-found: ignore
          retention-days: 14
