name: Start NovaBank
description: >-
  Check out the NovaBank application, migrate and seed a PostgreSQL database,
  and serve it on 127.0.0.1:3000. Replaces polling a hosted environment: the
  suite gets a freshly seeded database on every run, so assertions on absolute
  balances are safe and no test observes state left by another run.

inputs:
  app-repository:
    description: Repository holding the application under test
    required: false
    default: MohamedAmer45/novabank-banking-system
  app-token:
    description: >-
      Token used to check out the application. Only needed when that repository
      is private: the default GITHUB_TOKEN is scoped to the repository running
      the workflow and cannot read another private one.
    required: false
    default: ""
  app-ref:
    description: Ref of the application repository to test against
    required: false
    default: main
  database-url:
    description: PostgreSQL connection string for the app to use
    required: false
    default: postgresql://novabank:novabank@127.0.0.1:5432/novabank_test
  port:
    description: Port to serve the application on
    required: false
    default: "3000"

outputs:
  base-url:
    description: Base URL the application is serving on
    value: http://127.0.0.1:${{ inputs.port }}

runs:
  using: composite
  steps:
    # Checkout failures here are opaque, so the cause is named up front.
    # Uses git rather than the REST API: unauthenticated api.github.com calls
    # are rate limited per IP, and runners share IPs, so an API-based check can
    # report "unreachable" when it was only throttled.
    - name: Verify the application repository is reachable
      shell: bash
      env:
        APP_REPO: ${{ inputs.app-repository }}
        APP_TOKEN: ${{ inputs.app-token }}
        APP_REF: ${{ inputs.app-ref }}
      run: |
        if [ -n "$APP_TOKEN" ]; then
          url="https://x-access-token:${APP_TOKEN}@github.com/${APP_REPO}.git"
        else
          url="https://github.com/${APP_REPO}.git"
        fi

        if git ls-remote --heads "$url" "$APP_REF" | grep -q .; then
          echo "${APP_REPO} is reachable and has a '${APP_REF}' branch."
          exit 0
        fi

        echo "::error::Cannot read branch '${APP_REF}' of ${APP_REPO}."
        echo "::error::Either the repository does not exist, it is private and"
        echo "::error::needs app-token (the default GITHUB_TOKEN only covers this"
        echo "::error::repository), or the branch has not been pushed yet."
        exit 1

    - name: Check out NovaBank application
      uses: actions/checkout@v4
      with:
        repository: ${{ inputs.app-repository }}
        token: ${{ inputs.app-token || github.token }}
        ref: ${{ inputs.app-ref }}
        path: .novabank-app

    - name: Set up Node.js for the application
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install, migrate and seed
      shell: bash
      working-directory: .novabank-app
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        DATABASE_SSL: "false"
      run: |
        npm ci
        npm run db:migrate
        npm run db:seed

    - name: Start the application
      shell: bash
      working-directory: .novabank-app
      env:
        DATABASE_URL: ${{ inputs.database-url }}
        DATABASE_SSL: "false"
        QA_MODE: "true"
        PORT: ${{ inputs.port }}
      run: |
        node server.js > "${RUNNER_TEMP}/novabank.log" 2>&1 &
        echo $! > "${RUNNER_TEMP}/novabank.pid"

        for i in $(seq 1 30); do
          if curl -fsS "http://127.0.0.1:${{ inputs.port }}/api/health" >/dev/null; then
            echo "NovaBank is healthy on port ${{ inputs.port }}."
            exit 0
          fi
          sleep 1
        done

        echo "::error::NovaBank did not become healthy."
        cat "${RUNNER_TEMP}/novabank.log" || true
        exit 1
