# DATABASE_URL and BASE_URL environment variables take precedence, so the tests
# and the application always run against the same database.
# Default target is the deployed environment, so a fresh clone runs without
# starting anything locally. CI overrides this (it serves the application inside
# the runner against a throwaway database), and so can you:
#   -Dapi.base.url=http://localhost:3000
#
# Be aware of what this means: the deployed environment has one database, shared
# with anyone else using it. Tests that move money mutate it, so balance
# assertions must stay relative (see LIM-005 in
# docs/known-issues-and-limitations.md).
api.base.url=https://novabank-banking-system.vercel.app
